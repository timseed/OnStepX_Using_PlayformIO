; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DONSTEPX
  -DESP32

lib_ldf_mode = deep

lib_deps =
    ; --- 核心基础库 ---
    waspinator/AccelStepper @ ^1.64      ; 步进电机控制核心库
    bakercp/PacketSerial @ ^1.4.0        ; 串口通信协议库
    
    ; --- 常用硬件驱动 ---
    adafruit/Adafruit BME280 Library @ ^2.2.4 ; 气象传感器（温度、湿度、气压）
    adafruit/Adafruit SSD1306 @ ^2.5.9        ; OLED 显示屏驱动
    sparkfun/SparkFun BME280 @ ^2.0.8         ; 备选气象传感器库

    https://github.com/hjd1964/TMC2209.git

    ; --- 网络与无线功能 (如果使用 ESP32/ESP8266) ---
    bblanchon/ArduinoJson @ ^7.0.0            ; JSON 数据处理（Web界面/网络通信必备）
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ;https://github.com/me-no-dev/ESPAsyncWebServer.git ; 异步 Web 服务器（ESP32/8266 Web控制界面）
    ESP32Async/AsyncTCP @ ^3.3.2
    ;https://github.com/me-no-dev/AsyncTCP.git         ; ESP32 异步 TCP 库（ESPAsyncWebServer 的依赖）
    
    me-no-dev/AsyncTCP                                  ; ESP32 异步TCP库 (替代旧版ESPAsyncTCP)
    ;ESP32Async/ESPAsyncTCP @ ^2.0.0
    ;https://github.com/me-no-dev/ESPAsyncTCP.git      ; ESP8266 异步 TCP 库（ESPAsyncWebServer 的依赖）

    ;mikalhart/TinyGPSPlus @ ^1.1.0
    tinyu-zhao/TinyGPSPlus-ESP32 @ ^0.0.2

    ; --- 其他常见外设 ---
    adafruit/Adafruit NeoPixel @ ^1.12.0    ; WS2812 RGB 状态指示灯
    paulstoffregen/OneWire @ ^2.3.8         ; DS18B20 温度传感器（用于镜筒除露带控温）
    milesburton/DallasTemperature @ ^3.11.0 ; DS18B20 配套库
    https://github.com/Makuna/Rtc.git